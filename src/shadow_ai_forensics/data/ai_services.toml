[browser]
processes = ["chrome.exe", "msedge.exe", "firefox.exe", "whale.exe", "brave.exe", "opera.exe"]

[sensitive]
# 경로/파일명에 포함되면 민감 자료로 표시 (대소문자 무시)
keywords = [
  "재무", "기밀", "대외비", "인사", "급여", "연봉", "고객", "개인정보", "계약", "설계", "소스",
  "confidential", "secret", "salary", "payroll", "customer", "contract", "financial", "internal",
]
extensions = [".xlsx", ".xls", ".docx", ".doc", ".pptx", ".pdf", ".csv", ".hwp", ".hwpx", ".sql", ".txt"]

[archive]
extensions = [".zip", ".7z", ".rar", ".tar", ".gz", ".alz", ".egg"]

[local_model]
extensions = [".gguf", ".safetensors", ".ggml"]
