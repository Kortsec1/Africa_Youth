# Shadow AI 서비스 카탈로그
#
# role 의미
#   chat      : 대화형 UI 자체 (사용 행위의 직접 증거로 취급)
#   upload    : 파일 업로드/첨부 전용 엔드포인트 (업로드 정황의 강한 증거)
#   api       : 프로그래밍 API (스크립트·IDE·에이전트 사용 정황)
#   static    : CDN·정적 리소스 (단독으로는 사용 증거로 쓰지 않음)
#   corporate : 회사 홈페이지·블로그·문서 (방문 ≠ AI 사용, 오탐 방지용)
#
# 도메인은 접미사 일치(suffix match)로 판정한다. "chatgpt.com" 은 "ws.chatgpt.com" 도 포함.
# 목록은 2026-11 기준이며 서비스 정책에 따라 바뀌므로 주기적 갱신이 필요하다.
# 출처: OpenAI Help Center 'Network recommendations for ChatGPT' 등 (docs/research/05 참고)

[[service]]
name = "ChatGPT"
vendor = "OpenAI"
chat = ["chatgpt.com", "chat.openai.com"]
upload = ["oaiusercontent.com"]
api = ["api.openai.com"]
static = ["oaistatic.com", "oaistatsig.com"]
corporate = ["openai.com"]
processes = ["chatgpt.exe"]
window_titles = ["chatgpt"]

